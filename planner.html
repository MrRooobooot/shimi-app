<style>
  :root{
    --bg:   var(--tg-theme-bg-color, #080D1F);
    --bg2:  var(--tg-theme-secondary-bg-color, #0F172A);
    --text: var(--tg-theme-text-color, #F8FAFC);
    --hint: var(--tg-theme-hint-color, #94A3B8);
    --btn:  var(--tg-theme-button-color, #38BDF8);
    --btnT: var(--tg-theme-button-text-color, #06202B);
    --accent:#38BDF8; --gold:#F59E0B; --ok:#22C55E; --bad:#EF4444;
    --card: rgba(15, 23, 42, 0.75);
    --card-border: rgba(255, 255, 255, 0.10);
    --card-glow: 0 8px 32px 0 rgba(0, 0, 0, 0.45), inset 0 1px 0 0 rgba(255, 255, 255, 0.15);
    --card2: rgba(255, 255, 255, 0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background-color: var(--bg);
    background-image: 
      radial-gradient(600px circle at 50% -100px, rgba(56, 189, 248, 0.22), transparent 70%),
      radial-gradient(500px circle at 100% 80%, rgba(139, 92, 246, 0.18), transparent 70%),
      radial-gradient(400px circle at 0% 30%, rgba(236, 72, 153, 0.12), transparent 70%);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Vazirmatn", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.6;
    padding: max(16px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto; overflow-x: hidden;
  }

  /* nav — glassmorphic segmented */
  .nav{
    display: flex; gap: 6px;
    background: var(--card);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--card-border);
    box-shadow: var(--card-glow);
    border-radius: 18px; padding: 5px; margin-bottom: 20px;
  }
  .nav a{
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 11px 4px; border-radius: 14px; text-decoration: none; font-size: 13px;
    font-weight: 800; color: var(--hint); transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .nav a svg{ flex: 0 0 auto; opacity: 0.85; transition: transform 0.2s; }
  .nav a:active{ transform: scale(0.96); }
  .nav a.on{
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.28), rgba(99, 102, 241, 0.16));
    border: 1px solid rgba(56, 189, 248, 0.5);
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
    color: #FFF;
  }
  .nav a.on svg{ transform: scale(1.15); stroke: var(--accent); }

  /* header */
  .hd{ display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 20px; }
  .hd .t h1{ font-size: 18px; font-weight: 900; line-height: 1.25; }
  .hd .t p{ font-size: 12px; color: var(--hint); font-weight: 600; margin-top: 2px; }
  .wk{
    font-size: 12px; font-weight: 800; color: var(--accent);
    background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.35);
    box-shadow: 0 0 14px rgba(56, 189, 248, 0.2);
    border-radius: 999px; padding: 7px 14px; white-space: nowrap;
  }

  /* progress hero */
  .hero{
    display: flex; align-items: center; gap: 18px;
    background: var(--card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--card-border); box-shadow: var(--card-glow);
    border-radius: 22px; padding: 20px; margin-bottom: 20px;
    position: relative; overflow: hidden;
  }
  .hero::before{
    content: ''; position: absolute; top: -50px; right: -50px; width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.25), transparent 70%);
    pointer-events: none;
  }
  .ring{ position: relative; width: 92px; height: 92px; flex: 0 0 auto; }
  .ring svg{ transform: rotate(-90deg); filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.45)); }
  .ring .v{ position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .v b{ font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
  .ring .v span{ font-size: 10.5px; color: var(--hint); font-weight: 700; margin-top: 2px; }
  .hero .info{ flex: 1; min-width: 0; }
  .hero .info .row{ display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 700; color: var(--hint); margin-bottom: 5px; }
  .hero .info .row b{ color: var(--text); font-variant-numeric: tabular-nums; }
  .target{ display: flex; align-items: baseline; gap: 8px; margin-top: 10px; }
  .target label{ font-size: 12.5px; color: var(--hint); font-weight: 700; white-space: nowrap; }
  .target input{
    width: 62px; background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 10px; padding: 6px 8px; color: var(--gold); font: inherit; font-size: 14px;
    font-weight: 900; text-align: center; transition: all 0.2s;
  }
  .target input:focus{ outline: none; border-color: var(--accent); box-shadow: 0 0 14px rgba(56, 189, 248, 0.4); }
  .target span{ font-size: 12.5px; color: var(--hint); font-weight: 700; }

  /* day chips */
  .days{ display: flex; gap: 6px; margin-bottom: 18px; }
  .day{
    flex: 1 1 0; min-width: 0; text-align: center; padding: 11px 2px; border-radius: 16px;
    background: var(--card); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--card-border); box-shadow: var(--card-glow);
    cursor: pointer; transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);

  .day:active{ transform: scale(0.95); }
  .day b{ display: block; font-size: 13.5px; font-weight: 900; }
  .day i{ display: block; font-style: normal; font-size: 9.5px; color: var(--hint); font-weight: 700; margin-top: 2px; }
  .day .h{
    display: block; font-size: 10.5px; font-weight: 900; color: var(--gold); margin-top: 5px;

  }
  .day.on{
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.32), rgba(99, 102, 241, 0.22));
    border-color: rgba(56, 189, 248, 0.6);
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
    transform: translateY(-3px);
  }
  .day.on b{ color: #FFF; text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
  .day.on i{ color: var(--accent); }

  /* day panel */
  .panel{
    background: var(--card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--card-border); box-shadow: var(--card-glow);
    border-radius: 22px; padding: 20px; margin-bottom: 20px;
    animation: in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);

  @keyframes in{ from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .panel-hd{ display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .panel-hd h2{ font-size: 17px; font-weight: 900; }
  .panel-hd .sum{ font-size: 12.5px; color: var(--hint); font-weight: 700; }
  .panel-hd .sum b{ color: var(--gold); font-variant-numeric: tabular-nums; }

  /* study items */

  .item{
    display: flex; align-items: center; gap: 12px;
    background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 16px; padding: 14px 16px; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);

  .item:hover{ background: rgba(255, 255, 255, 0.06); }
  .item.done{

    box-shadow: 0 0 18px rgba(34, 197, 94, 0.2);
  }
  .item.done .t{ text-decoration: line-through; opacity: 0.55; }
  .chk{
    width: 24px; height: 24px; border-radius: 8px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    flex: 0 0 auto;
  }
  .chk:active{ transform: scale(0.85); }
  .item.done .chk{
    background: var(--ok); border-color: var(--ok);
    box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
  }
  .chk svg{ opacity: 0; transform: scale(0.6); transition: all 0.2s; stroke: #04240F; stroke-width: 3.5; }
  .item.done .chk svg{ opacity: 1; transform: scale(1); }
  .item .info{ flex: 1; min-width: 0; }
  .item .info .t{ font-size: 15px; font-weight: 800; color: var(--text); }
  .item .info .sub{ font-size: 12px; color: var(--hint); font-weight: 600; margin-top: 2px; }
  .hours{
    display: flex; align-items: center; gap: 5px; background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 5px 10px;
  }
  .hours input{
    width: 34px; background: transparent; border: 0; color: var(--gold);
    font: inherit; font-size: 14px; font-weight: 900; text-align: center;
  }
  .hours input:focus{ outline: none; }
  .hours span{ font-size: 11.5px; color: var(--hint); font-weight: 700; }

  /* chart card */
  .chart-card{
    background: var(--card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--card-border); box-shadow: var(--card-glow);
    border-radius: 22px; padding: 20px; margin-bottom: 20px;
  }
  .chart-card h3{ font-size: 14.5px; font-weight: 800; color: var(--text); margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }
  .bars{ display: flex; align-items: flex-end; gap: 8px; height: 95px; padding-top: 15px; }
  .col{ flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; }
  .col .vv{ font-size: 10px; font-weight: 900; color: var(--gold); min-height: 14px; font-variant-numeric: tabular-nums; }
  .col .b{
    width: 100%; background: linear-gradient(180deg, var(--accent), #0284C7);
    border-radius: 6px 6px 2px 2px; min-height: 4px;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    transition: height 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .col.today .b{
    background: linear-gradient(180deg, var(--gold), #D97706);
    box-shadow: 0 0 14px rgba(245, 158, 11, 0.5);
  }
  .col .lbl{ font-size: 10px; color: var(--hint); font-weight: 700; }
  .col.today .lbl{ color: var(--gold); font-weight: 900; }

  .foot{ margin-top: 20px; text-align: center; font-size: 11.5px; color: var(--hint); font-weight: 600; }
  .foot a{ color: var(--accent); text-decoration: none; font-weight: 800; }
  .saved{
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(50px);
    background: linear-gradient(135deg, rgba(34, 197, 94, 0.9), rgba(21, 128, 61, 0.9));
    color: #FFF; padding: 8px 18px; border-radius: 999px; font-size: 13px; font-weight: 800;
    box-shadow: 0 4px 20px rgba(34, 197, 94, 0.4); pointer-events: none; opacity: 0;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 1000;
  }
  .saved.on{ transform: translateX(-50%) translateY(0); opacity: 1; }
</style>

<script>

/* ----- Lightweight Confetti Effect ----- */
function fireConfetti(x = window.innerWidth / 2, y = window.innerHeight / 3) {
  const canvas = document.createElement('canvas');
  canvas.style.position = 'fixed';
  canvas.style.inset = '0';
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.pointerEvents = 'none';
  canvas.style.zIndex = '9999';
  document.body.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ['#38BDF8', '#F1C40F', '#22C55E', '#EC4899', '#A855F7', '#F97316'];
  const particles = Array.from({ length: 45 }, () => ({
    x: x,
    y: y,
    vx: (Math.random() - 0.5) * 12,
    vy: (Math.random() - 0.8) * 14 - 2,
    size: Math.random() * 6 + 4,
    color: colors[Math.floor(Math.random() * colors.length)],
    rot: Math.random() * 360,
    vrot: (Math.random() - 0.5) * 15,
    alpha: 1
  }));

  let start = null;
  function step(ts) {
    if (!start) start = ts;
    const progress = ts - start;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.45;
      p.rot += p.vrot;
      p.alpha = Math.max(0, 1 - progress / 1200);

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rot * Math.PI) / 180);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.alpha;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
    });

    if (progress < 1200) {
      requestAnimationFrame(step);
    } else {
      canvas.remove();
    }
  }
  requestAnimationFrame(step);
}

/* ---------------- Persian digits ---------------- */
const FA=["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];
const fa = n => String(n).replace(/\d/g, d => FA[+d]);
const en = s => String(s).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));

/* ---------------- Telegram SDK (optional) ---------------- */
const TG = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (TG) { TG.ready(); TG.expand(); if (TG.isVersionAtLeast && TG.isVersionAtLeast('6.1')) { try { TG.setHeaderColor('#080D1F'); } catch(e){} try { TG.setBackgroundColor('#080D1F'); } catch(e){} } if (TG.isVersionAtLeast && TG.isVersionAtLeast('7.10')) { try { TG.setBottomBarColor('#080D1F'); } catch(e){} } }
const haptic = t => { if (TG && TG.HapticFeedback) { try { TG.HapticFeedback.impactOccurred(t); } catch(e){} } };

/* ---------------- Jalali (no deps) ---------------- */
function g2j(gy, gm, gd){
  const m=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy, gy2;
  if (gy>1600){ jy=979; gy-=1600 } else { jy=0; gy-=621 }
  gy2 = gm>2 ? gy+1 : gy;
  let days = 365*gy + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100)
           + Math.floor((gy2+399)/400) - 80 + gd + m[gm-1];
  jy += 33*Math.floor(days/12053); days %= 12053;
  jy += 4*Math.floor(days/1461);  days %= 1461;
  if (days>365){ jy += Math.floor((days-1)/365); days = (days-1)%365 }
  let jm, jd;
  if (days<186){ jm = 1+Math.floor(days/31); jd = 1+(days%31) }
  else { jm = 7+Math.floor((days-186)/30); jd = 1+((days-186)%30) }
  return [jy, jm, jd];
}
const JM=["","فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const DAYN=["دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه","شنبه","یکشنبه"];
const DAYS=["د","س","چ","پ","ج","ش","ی"];   // short forms for narrow chips

const PARTS = ["صبح زود","قبل از ظهر","بعد از ظهر","غروب","شب","مرور شب"];
const PARTS_EN = ["p1","p2","p3","p4","p5","p6"];
const KEY = "shimi_planner_v1";

/* ---------------- build week (Sat..Fri) ---------------- */
const today = new Date();
const weekStart = new Date(today);
if (today.getDay() === 4 || today.getDay() === 5) {
  const satOff = (6 - today.getDay() + 7) % 7;
  weekStart.setDate(today.getDate() + satOff);
} else {
  const satOff = (today.getDay() - 6 + 7) % 7;
  weekStart.setDate(today.getDate() - satOff);
}

const WEEK = [];
for (let i=0;i<7;i++){
  const d = new Date(weekStart); d.setDate(weekStart.getDate()+i);
  const [jy,jm,jd] = g2j(d.getFullYear(), d.getMonth()+1, d.getDate());
  const idx = (d.getDay()+6)%7;
  WEEK.push({ key: d.toISOString().slice(0,10), name: DAYN[idx], short: DAYS[idx],
              date: fa(jd)+" "+JM[jm], dateShort: fa(jd),
              isToday: d.toDateString()===today.toDateString() });
}

/* ---------------- state ---------------- */
let state = { target: 30, days: {} };
WEEK.forEach(d => state.days[d.key] = PARTS.map(() => ({ sub:"", hrs:"", done:false })));

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s && s.days){
      state.target = s.target || 30;
      WEEK.forEach(d => { if (s.days[d.key]) state.days[d.key] = s.days[d.key]; });
    }
  } catch(e){}
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
    const el = document.getElementById("saved");
    el.classList.add("show"); setTimeout(()=>el.classList.remove("show"), 1100);
  }, 400);
}

/* ---------------- helpers ---------------- */
const dayHours = k => state.days[k].reduce((s,p) => s + (parseFloat(en(p.hrs)) || 0), 0);
const totalDone = () => WEEK.reduce((s,d) => s + dayHours(d.key), 0);

/* ---------------- render ---------------- */
let active = WEEK.find(d => d.isToday) ? WEEK.find(d => d.isToday).key : WEEK[0].key;

function renderWeekLabel(){
  const a = WEEK[0], z = WEEK[6];
  document.getElementById("wkLabel").textContent = `${a.date} تا ${z.date}`;
}

function renderDays(){
  document.getElementById("days").innerHTML = WEEK.map(d => {
    const h = dayHours(d.key);
    return `<div class="day ${d.key===active?"on":""}" data-k="${d.key}" title="${d.name}">
      <b>${d.short}</b><i>${d.dateShort}</i>
      <span class="h">${h?fa(Math.round(h*10)/10):"—"}</span>
    </div>`;
  }).join("");
  document.querySelectorAll(".day").forEach(el =>
    el.addEventListener("click", () => { active = el.dataset.k; haptic("light"); render(); }));
}

/* numeric inputs: accept Latin typing, display Persian when not focused */
function bindNum(inp, onVal){
  inp.addEventListener("input", () => { onVal(en(inp.value)); save(); });
  inp.addEventListener("focus", () => { inp.value = en(inp.value); });
  inp.addEventListener("blur",  () => { inp.value = fa(inp.value); });
}

function renderParts(){
  const list = state.days[active];
  document.getElementById("parts").innerHTML = list.map((p,i) => `
    <div class="part ${p.done?"done":""}" data-i="${i}">
      <button class="chk" data-act="toggle" data-i="${i}">✓</button>
      <div class="body">
        <div class="nm">پارت ${fa(i+1)} — ${PARTS[i]}</div>
        <input class="sub" data-act="sub" data-i="${i}" placeholder="مبحث و درس..." value="${p.sub||""}">
      </div>
      <input class="hrs" data-act="hrs" data-i="${i}" placeholder="۰" inputmode="decimal" value="${p.hrs?fa(p.hrs):""}">
    </div>`).join("");

  document.querySelectorAll('[data-act="toggle"]').forEach(b =>
    b.addEventListener("click", () => {
      const i = +b.dataset.i;
      state.days[active][i].done = !state.days[active][i].done;
      haptic(state.days[active][i].done ? "medium" : "light");
      save(); render();
    }));
  document.querySelectorAll('[data-act="sub"]').forEach(inp =>
    inp.addEventListener("input", () => { state.days[active][+inp.dataset.i].sub = inp.value; save(); }));
  document.querySelectorAll('[data-act="hrs"]').forEach(inp =>
    bindNum(inp, v => {
      state.days[active][+inp.dataset.i].hrs = v;
      renderHero(); renderDays(); renderBars();
    }));
}

function renderHero(){
  const done = totalDone();
  const tgt  = Math.max(1, state.target || 30);
  const pct  = Math.min(100, Math.round((done / tgt) * 100));
  const C    = 2 * Math.PI * 34;
  const arc  = document.getElementById("ringArc");
  arc.style.strokeDashoffset = C - (pct/100)*C;
  arc.style.stroke = pct >= 100 ? "var(--ok)" : pct >= 50 ? "var(--gold)" : "var(--accent)";
  document.getElementById("ringPct").textContent = fa(pct) + "٪";
  document.getElementById("doneH").textContent   = fa(Math.round(done*10)/10);
  document.getElementById("leftH").textContent   = fa(Math.max(0, Math.round((tgt-done)*10)/10));
}

function renderBars(){
  const max = Math.max(1, ...WEEK.map(d => dayHours(d.key)));
  document.getElementById("bars").innerHTML = WEEK.map(d => {
    const h = dayHours(d.key);
    const pctH = Math.max(3, (h/max)*100);
    return `<div class="col ${d.isToday?"today":""}">
      <span class="vv">${h?fa(h):""}</span>
      <div class="b" style="height:${pctH}%"></div>
      <span class="lbl">${d.short}</span>
    </div>`;
  }).join("");
}

function render(){
  renderWeekLabel(); renderDays(); renderParts(); renderHero(); renderBars();
}

/* ---------------- init ---------------- */
load();
const tInp = document.getElementById("targetInp");
tInp.value = fa(state.target);
bindNum(tInp, v => { state.target = Math.max(1, parseFloat(v) || 30); renderHero(); });
render();
</script>
</body>
</html>
