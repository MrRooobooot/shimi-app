<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پلنر مطالعاتی شیمی کنکور</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:   var(--tg-theme-bg-color, #0A1128);
    --bg2:  var(--tg-theme-secondary-bg-color, #0F1B3D);
    --text: var(--tg-theme-text-color, #EAF2FF);
    --hint: var(--tg-theme-hint-color, #A7B7D6);
    --btn:  var(--tg-theme-button-color, #38BDF8);
    --btnT: var(--tg-theme-button-text-color, #06202B);
    --accent:#38BDF8; --gold:#F1C40F; --ok:#22C55E; --bad:#EF4444;
    --line: rgba(255,255,255,.07); --card: rgba(255,255,255,.045);
    --card2:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Vazirmatn",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.6;
    padding:max(14px, env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));
    max-width:560px; margin:0 auto; overflow-x:hidden;
  }

  /* nav — soft segmented */
  .nav{display:flex;gap:4px;background:var(--card);border-radius:14px;padding:4px;margin-bottom:16px}
  .nav a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
         padding:10px 6px;border-radius:10px;text-decoration:none;font-size:13.5px;
         font-weight:800;color:var(--hint);transition:.18s}
  .nav a svg{flex:0 0 auto;opacity:.85}
  .nav a.on{background:rgba(56,189,248,.16);color:var(--accent)}

  /* header */
  .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
  .hd .t h1{font-size:16px;font-weight:900;line-height:1.25}
  .hd .t p{font-size:11.5px;color:var(--hint);font-weight:600}
  .wk{font-size:11px;font-weight:800;color:var(--accent);background:rgba(56,189,248,.10);
      border-radius:999px;padding:6px 12px;white-space:nowrap}

  /* progress hero */
  .hero{display:flex;align-items:center;gap:14px;background:var(--card);
        border-radius:16px;padding:14px 16px;margin-bottom:16px}
  .ring{position:relative;width:82px;height:82px;flex:0 0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .v b{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
  .ring .v span{font-size:9.5px;color:var(--hint);font-weight:700}
  .hero .info{flex:1;min-width:0}
  .hero .info .row{display:flex;justify-content:space-between;font-size:12.5px;
                   font-weight:700;color:var(--hint);margin-bottom:3px}
  .hero .info .row b{color:var(--text);font-variant-numeric:tabular-nums}
  .target{display:flex;align-items:baseline;gap:7px;margin-top:8px}
  .target label{font-size:11.5px;color:var(--hint);font-weight:700;white-space:nowrap}
  .target input{width:56px;background:var(--card2);border:0;border-radius:8px;
                padding:6px 8px;color:var(--text);font:inherit;font-size:13px;font-weight:800;text-align:center}
  .target input:focus{outline:none}
  .target span{font-size:11.5px;color:var(--hint);font-weight:700}

  /* day chips — flat, quiet */
  .days{display:flex;gap:4px;margin-bottom:14px}
  .day{flex:1 1 0;min-width:0;text-align:center;padding:8px 2px;border-radius:11px;
       background:var(--card);cursor:pointer;transition:.18s;border:1px solid transparent}
  .day b{display:block;font-size:13px;font-weight:900}
  .day i{display:block;font-style:normal;font-size:9px;color:var(--hint);font-weight:700;margin-top:1px}
  .day .h{display:block;font-size:9.5px;font-weight:900;color:var(--gold);margin-top:3px;
          font-variant-numeric:tabular-nums;min-height:13px}
  .day.on{background:rgba(56,189,248,.13);border-color:rgba(56,189,248,.45)}
  .day.on b{color:var(--accent)}

  /* parts — clean rows */
  .part{display:flex;align-items:center;gap:10px;background:var(--card);
        border-radius:13px;padding:11px 13px;margin-bottom:8px;transition:.18s;border:1px solid transparent}
  .part.done{background:rgba(34,197,94,.09);border-color:rgba(34,197,94,.4)}
  .chk{flex:0 0 auto;width:25px;height:25px;border-radius:8px;border:1.4px solid rgba(255,255,255,.28);
       background:transparent;display:flex;align-items:center;justify-content:center;
       font-size:14px;font-weight:900;color:transparent;cursor:pointer;transition:.15s}
  .part.done .chk{background:var(--ok);border-color:var(--ok);color:#04240F}
  .part .body{flex:1;min-width:0}
  .part .nm{font-size:11px;color:var(--hint);font-weight:800;margin-bottom:3px;opacity:1}
  .part input.sub{width:100%;background:transparent;border:0;
                  padding:2px 0 3px;color:var(--text);font:inherit;font-size:13.5px;font-weight:700}
  .part input.sub::placeholder{color:var(--hint);font-weight:600;opacity:.7}
  .part input.sub:focus{outline:none}
  .part .hrs{flex:0 0 auto;width:56px;background:var(--card2);border:0;border-radius:9px;
             padding:8px 4px;color:var(--text);font:inherit;font-size:13.5px;
             font-weight:900;text-align:center;font-variant-numeric:tabular-nums}
  .part .hrs:focus{outline:none}

  /* week chart */
  .chart{margin-top:16px;background:var(--card);border-radius:16px;padding:14px}
  .chart h3{font-size:12.5px;font-weight:900;color:var(--hint);margin-bottom:12px}
  .bars{display:flex;align-items:flex-end;gap:5px;height:88px}
  .bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
  .bars .b{width:100%;border-radius:6px 6px 3px 3px;background:var(--accent);
           min-height:3px;transition:height .35s cubic-bezier(.4,0,.2,1);opacity:.9}
  .bars .col.today .b{background:var(--gold)}
  .bars .lbl{font-size:9px;color:var(--hint);font-weight:800;white-space:nowrap}
  .bars .vv{font-size:9.5px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--text)}

  .foot{margin-top:20px;padding-top:0;
        text-align:center;font-size:11px;color:var(--hint);font-weight:600}
  .foot a{color:var(--accent);text-decoration:none;font-weight:800}
  .saved{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(60px);
         background:var(--ok);color:#04240F;font-size:12px;font-weight:900;
         padding:8px 16px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
  .saved.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<div class="nav">
  <a href="index.html" class=""><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6v4H9zM7 4H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"/><path d="M8 12h6M8 16h4"/></svg><span>آزمون</span></a>
  <a href="planner.html" class="on"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>پلنر</span></a>
</div>
<div class="hd">
  <div class="t">
    <h1>پلنر مطالعاتی هفتگی</h1>
    <p>شیمی کنکور • الهه محمددوست</p>
  </div>
  <div class="wk" id="wkLabel">—</div>
</div>

<div class="hero">
  <div class="ring">
    <svg width="82" height="82">
      <circle cx="41" cy="41" r="34" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="8"/>
      <circle id="ringArc" cx="41" cy="41" r="34" fill="none" stroke="var(--accent)" stroke-width="8"
              stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6"/>
    </svg>
    <div class="v"><b id="ringPct">۰٪</b><span>پیشرفت</span></div>
  </div>
  <div class="info">
    <div class="row"><span>مطالعه‌شده</span><b><span id="doneH">۰</span> ساعت</b></div>
    <div class="row"><span>باقی‌مانده</span><b><span id="leftH">۰</span> ساعت</b></div>
    <div class="target">
      <label>هدف هفته:</label>
      <input id="targetInp" type="text" inputmode="numeric" value="۳۰">
      <span>ساعت</span>
    </div>
  </div>
</div>

<div class="days" id="days"></div>
<div id="parts"></div>

<div class="chart">
  <h3>ساعت مطالعه هر روز</h3>
  <div class="bars" id="bars"></div>
</div>

<div class="foot">
  کانال شیمی کنکور — <a href="https://t.me/shimi_mohamaddost">@shimi_mohamaddost</a>
</div>
<div class="saved" id="saved">ذخیره شد ✓</div>

<script>
/* ---------------- Persian digits ---------------- */
const FA=["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];
const fa = n => String(n).replace(/\d/g, d => FA[+d]);
const en = s => String(s).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));

/* ---------------- Telegram SDK (optional) ---------------- */
const TG = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (TG) { TG.ready(); TG.expand(); try { TG.setHeaderColor("secondary_bg_color"); } catch(e){} }
const haptic = t => { if (TG && TG.HapticFeedback) { try { TG.HapticFeedback.impactOccurred(t); } catch(e){} } };

/* ---------------- Jalali (no deps) ---------------- */
function g2j(gy, gm, gd){
  const m=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy, gy2;
  if (gy>1600){ jy=979; gy-=1600 } else { jy=0; gy-=621 }
  gy2 = gm>2 ? gy+1 : gy;
  let days = 365*gy + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100)
           + Math.floor((gy2+399)/400) - 80 + gd + m[gm-1];
  jy += 33*Math.floor(days/12053); days %= 12053;
  jy += 4*Math.floor(days/1461);  days %= 1461;
  if (days>365){ jy += Math.floor((days-1)/365); days = (days-1)%365 }
  let jm, jd;
  if (days<186){ jm = 1+Math.floor(days/31); jd = 1+(days%31) }
  else { jm = 7+Math.floor((days-186)/30); jd = 1+((days-186)%30) }
  return [jy, jm, jd];
}
const JM=["","فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const DAYN=["دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه","شنبه","یکشنبه"];
const DAYS=["د","س","چ","پ","ج","ش","ی"];   // short forms for narrow chips

const PARTS = ["صبح زود","قبل از ظهر","بعد از ظهر","غروب","شب","مرور شب"];
const PARTS_EN = ["p1","p2","p3","p4","p5","p6"];
const KEY = "shimi_planner_v1";

/* ---------------- build week (Sat..Fri) ---------------- */
const today = new Date();
const weekStart = new Date(today);
if (today.getDay() === 4 || today.getDay() === 5) {
  const satOff = (6 - today.getDay() + 7) % 7;
  weekStart.setDate(today.getDate() + satOff);
} else {
  const satOff = (today.getDay() - 6 + 7) % 7;
  weekStart.setDate(today.getDate() - satOff);
}

const WEEK = [];
for (let i=0;i<7;i++){
  const d = new Date(weekStart); d.setDate(weekStart.getDate()+i);
  const [jy,jm,jd] = g2j(d.getFullYear(), d.getMonth()+1, d.getDate());
  const idx = (d.getDay()+6)%7;
  WEEK.push({ key: d.toISOString().slice(0,10), name: DAYN[idx], short: DAYS[idx],
              date: fa(jd)+" "+JM[jm], dateShort: fa(jd),
              isToday: d.toDateString()===today.toDateString() });
}

/* ---------------- state ---------------- */
let state = { target: 30, days: {} };
WEEK.forEach(d => state.days[d.key] = PARTS.map(() => ({ sub:"", hrs:"", done:false })));

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s && s.days){
      state.target = s.target || 30;
      WEEK.forEach(d => { if (s.days[d.key]) state.days[d.key] = s.days[d.key]; });
    }
  } catch(e){}
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
    const el = document.getElementById("saved");
    el.classList.add("show"); setTimeout(()=>el.classList.remove("show"), 1100);
  }, 400);
}

/* ---------------- helpers ---------------- */
const dayHours = k => state.days[k].reduce((s,p) => s + (parseFloat(en(p.hrs)) || 0), 0);
const totalDone = () => WEEK.reduce((s,d) => s + dayHours(d.key), 0);

/* ---------------- render ---------------- */
let active = WEEK.find(d => d.isToday) ? WEEK.find(d => d.isToday).key : WEEK[0].key;

function renderWeekLabel(){
  const a = WEEK[0], z = WEEK[6];
  document.getElementById("wkLabel").textContent = `${a.date} تا ${z.date}`;
}

function renderDays(){
  document.getElementById("days").innerHTML = WEEK.map(d => {
    const h = dayHours(d.key);
    return `<div class="day ${d.key===active?"on":""}" data-k="${d.key}" title="${d.name}">
      <b>${d.short}</b><i>${d.dateShort}</i>
      <span class="h">${h?fa(Math.round(h*10)/10):"—"}</span>
    </div>`;
  }).join("");
  document.querySelectorAll(".day").forEach(el =>
    el.addEventListener("click", () => { active = el.dataset.k; haptic("light"); render(); }));
}

/* numeric inputs: accept Latin typing, display Persian when not focused */
function bindNum(inp, onVal){
  inp.addEventListener("input", () => { onVal(en(inp.value)); save(); });
  inp.addEventListener("focus", () => { inp.value = en(inp.value); });
  inp.addEventListener("blur",  () => { inp.value = fa(inp.value); });
}

function renderParts(){
  const list = state.days[active];
  document.getElementById("parts").innerHTML = list.map((p,i) => `
    <div class="part ${p.done?"done":""}" data-i="${i}">
      <button class="chk" data-act="toggle" data-i="${i}">✓</button>
      <div class="body">
        <div class="nm">پارت ${fa(i+1)} — ${PARTS[i]}</div>
        <input class="sub" data-act="sub" data-i="${i}" placeholder="مبحث و درس..." value="${p.sub||""}">
      </div>
      <input class="hrs" data-act="hrs" data-i="${i}" placeholder="۰" inputmode="decimal" value="${p.hrs?fa(p.hrs):""}">
    </div>`).join("");

  document.querySelectorAll('[data-act="toggle"]').forEach(b =>
    b.addEventListener("click", () => {
      const i = +b.dataset.i;
      state.days[active][i].done = !state.days[active][i].done;
      haptic(state.days[active][i].done ? "medium" : "light");
      save(); render();
    }));
  document.querySelectorAll('[data-act="sub"]').forEach(inp =>
    inp.addEventListener("input", () => { state.days[active][+inp.dataset.i].sub = inp.value; save(); }));
  document.querySelectorAll('[data-act="hrs"]').forEach(inp =>
    bindNum(inp, v => {
      state.days[active][+inp.dataset.i].hrs = v;
      renderHero(); renderDays(); renderBars();
    }));
}

function renderHero(){
  const done = totalDone();
  const tgt  = Math.max(1, state.target || 30);
  const pct  = Math.min(100, Math.round((done / tgt) * 100));
  const C    = 2 * Math.PI * 34;
  const arc  = document.getElementById("ringArc");
  arc.style.strokeDashoffset = C - (pct/100)*C;
  arc.style.stroke = pct >= 100 ? "var(--ok)" : pct >= 50 ? "var(--gold)" : "var(--accent)";
  document.getElementById("ringPct").textContent = fa(pct) + "٪";
  document.getElementById("doneH").textContent   = fa(Math.round(done*10)/10);
  document.getElementById("leftH").textContent   = fa(Math.max(0, Math.round((tgt-done)*10)/10));
}

function renderBars(){
  const max = Math.max(1, ...WEEK.map(d => dayHours(d.key)));
  document.getElementById("bars").innerHTML = WEEK.map(d => {
    const h = dayHours(d.key);
    const pctH = Math.max(3, (h/max)*100);
    return `<div class="col ${d.isToday?"today":""}">
      <span class="vv">${h?fa(h):""}</span>
      <div class="b" style="height:${pctH}%"></div>
      <span class="lbl">${d.short}</span>
    </div>`;
  }).join("");
}

function render(){
  renderWeekLabel(); renderDays(); renderParts(); renderHero(); renderBars();
}

/* ---------------- init ---------------- */
load();
const tInp = document.getElementById("targetInp");
tInp.value = fa(state.target);
bindNum(tInp, v => { state.target = Math.max(1, parseFloat(v) || 30); renderHero(); });
render();
</script>
</body>
</html>
