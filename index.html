<style>
  :root{
    --bg:      var(--tg-theme-bg-color, #080E21);
    --bg2:     var(--tg-theme-secondary-bg-color, #0F172A);
    --text:    var(--tg-theme-text-color, #F1F5F9);
    --hint:    var(--tg-theme-hint-color, #94A3B8);
    --btn:     var(--tg-theme-button-color, #38BDF8);
    --btn-txt: var(--tg-theme-button-text-color, #06202B);
    --accent:  #38BDF8;
    --gold:    #F59E0B;
    --ok:      #22C55E;
    --bad:     #EF4444;
    --card:    rgba(15, 23, 42, 0.72);
    --card-border: rgba(255, 255, 255, 0.08);
    --card-glow: inset 0 1px 0 0 rgba(255, 255, 255, 0.12), 0 4px 20px -2px rgba(0, 0, 0, 0.4);
    --card2:   rgba(255, 255, 255, 0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background-color: var(--bg);
    background-image: 
      radial-gradient(600px circle at 50% -100px, rgba(56, 189, 248, 0.22), transparent 70%),
      radial-gradient(500px circle at 100% 80%, rgba(139, 92, 246, 0.18), transparent 70%),
      radial-gradient(400px circle at 0% 30%, rgba(236, 72, 153, 0.12), transparent 70%);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Vazirmatn", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.6;
    padding: max(16px, env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto; overflow-x: hidden;
  }

  /* nav — glassmorphic segmented */
  .nav{
    display: flex; gap: 5px;
    background: var(--card);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    box-shadow: var(--card-glow);
    border-radius: 16px; padding: 5px; margin-bottom: 18px;
  }
  .nav a{
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 4px; border-radius: 12px; text-decoration: none; font-size: 12.5px;
    font-weight: 800; color: var(--hint); transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .nav a svg{ flex: 0 0 auto; opacity: 0.85; transition: transform 0.2s; }
  .nav a:active{ transform: scale(0.96); }
  .nav a.on{
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(14, 165, 233, 0.12));
    border: 1px solid rgba(56, 189, 248, 0.4);
    box-shadow: 0 0 16px rgba(56, 189, 248, 0.2);
    color: var(--accent);
  }
  .nav a.on svg{ transform: scale(1.1); }

  /* header */
  .top{ display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .brand{ display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo{
    width: 40px; height: 40px; border-radius: 13px; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--accent), #0284C7);
    display: flex; align-items: center; justify-content: center; color: #06202B;
    box-shadow: 0 4px 16px rgba(56, 189, 248, 0.35);
  }
  .brand h1{ font-size: 16px; font-weight: 900; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand p{ font-size: 11.5px; color: var(--hint); font-weight: 600; }
  .timer{
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 800; color: var(--accent);
    background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 999px; padding: 7px 14px; min-width: 66px; justify-content: center;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.15);
    transition: all 0.25s;
  }
  .timer.warn{
    color: var(--bad); background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.4);
    box-shadow: 0 0 18px rgba(239, 68, 68, 0.3);
    animation: pulse 1s infinite;
  }
  @keyframes pulse{
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  /* grade chips */
  .grades{ display: flex; gap: 6px; margin-bottom: 16px; }
  .gb{
    flex: 1; background: var(--card);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--card-border);
    border-radius: 12px; padding: 9px 2px; font: inherit; font-size: 12px;
    font-weight: 800; color: var(--hint); cursor: pointer;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .gb:active{ transform: scale(0.95); }
  .gb.on{
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(99, 102, 241, 0.18));
    border-color: rgba(56, 189, 248, 0.5);
    box-shadow: 0 0 14px rgba(56, 189, 248, 0.22);
    color: #FFF;
  }

  /* progress bar */
  .bar{
    height: 6px; background: rgba(255, 255, 255, 0.06);
    border-radius: 999px; overflow: hidden; margin-bottom: 22px;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3);
  }
  .bar>i{
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, #38BDF8, #818CF8, #38BDF8);
    background-size: 200% 100%;
    border-radius: 999px;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    animation: shimmer 2.5s infinite linear;
    transition: width 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes shimmer{
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* question card */
  .qcard{
    background: var(--card);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    box-shadow: var(--card-glow);
    border-radius: 20px; padding: 20px; margin-bottom: 16px;
    animation: floatIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes floatIn{
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .qno{
    display: inline-block; font-size: 12px; font-weight: 800;
    color: var(--accent); background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 999px; padding: 3px 11px; margin-bottom: 10px;
  }
  .qtext{ font-size: 16.5px; font-weight: 800; line-height: 1.8; color: var(--text); }
  .eq{
    direction: ltr; unicode-bidi: isolate; text-align: center;
    font-size: 15px; font-weight: 800; letter-spacing: 0.2px; color: var(--accent);
    background: rgba(0, 0, 0, 0.28); border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px; padding: 10px 14px; margin-top: 12px;
    overflow-x: auto; white-space: nowrap;
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.25);
  }

  /* options */
  .opts{ display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .opt{
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: right;
    background: var(--card);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--card-border);
    box-shadow: var(--card-glow);
    border-radius: 16px; padding: 15px 16px;
    font: inherit; font-weight: 700; font-size: 15.5px; color: var(--text);
    cursor: pointer; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .opt:active{ transform: scale(0.97); }
  .opt .k{
    flex: 0 0 auto; width: 28px; height: 28px; border-radius: 8px;
    background: var(--card2); display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 900; color: var(--hint);
    transition: all 0.2s;
  }
  .opt.correct{
    border-color: rgba(34, 197, 94, 0.8);
    background: linear-gradient(135deg, rgba(34, 197, 94, 0.20), rgba(34, 197, 94, 0.08));
    box-shadow: 0 0 24px rgba(34, 197, 94, 0.35);
    animation: pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .opt.correct .k{ background: var(--ok); color: #04240F; }
  .opt.wrong{
    border-color: rgba(239, 68, 68, 0.8);
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.20), rgba(239, 68, 68, 0.08));
    box-shadow: 0 0 22px rgba(239, 68, 68, 0.3);
    animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  }
  .opt.wrong .k{ background: var(--bad); color: #FFF; }
  @keyframes shake{
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }
  @keyframes pop{
    0% { transform: scale(0.96); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }
  .opt[disabled]{ cursor: default; }

  /* feedback */
  .fb{
    margin-top: 16px; border-radius: 16px; padding: 16px;
    background: var(--card); backdrop-filter: blur(16px);
    border: 1px solid var(--card-border); box-shadow: var(--card-glow);
    animation: in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes in{ from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .fb h3{ font-size: 15px; font-weight: 900; margin-bottom: 8px; display: flex; align-items: center; gap: 7px; }
  .fb.ok h3{ color: var(--ok); } .fb.no h3{ color: var(--bad); }
  .fb p{ font-size: 14.5px; color: var(--text); opacity: 0.93; }
  .fb .steps{
    direction: ltr; unicode-bidi: isolate; text-align: left;
    font-family: ui-monospace, Menlo, monospace; font-size: 13px; line-height: 1.9;
    font-variant-numeric: tabular-nums;
    background: rgba(0, 0, 0, 0.32); border-radius: 12px; padding: 12px 14px; margin-top: 12px;
    border: 1px solid rgba(255, 255, 255, 0.05); color: var(--accent); overflow-x: auto;
  }

  /* buttons */
  .cta{
    display: block; width: 100%; margin-top: 18px;
    background: linear-gradient(135deg, #38BDF8, #0284C7);
    color: #06202B; border: 0; border-radius: 16px; padding: 16px;
    font: inherit; font-size: 16px; font-weight: 900; cursor: pointer;
    box-shadow: 0 6px 22px rgba(56, 189, 248, 0.35);
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .cta:active{ transform: scale(0.97); }
  .cta.ghost{
    background: rgba(56, 189, 248, 0.12); color: var(--accent);
    border: 1px solid rgba(56, 189, 248, 0.35);
    box-shadow: none;
  }
  .cta[hidden]{ display: none; }

  /* result */
  .result{
    text-align: center; padding: 20px 10px;
    animation: in 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .ring{ position: relative; width: 158px; height: 158px; margin: 6px auto 18px; }
  .ring svg{ transform: rotate(-90deg); filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.35)); }
  .ring .val{
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
  }
  .ring .val b{ font-size: 38px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
  .ring .val span{ font-size: 12px; color: var(--hint); font-weight: 700; }
  .result h2{ font-size: 22px; font-weight: 900; margin-bottom: 7px; }
  .result .sub{ font-size: 14.5px; color: var(--hint); font-weight: 600; margin-bottom: 20px; }
  .stats{ display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .stat{
    background: var(--card); backdrop-filter: blur(12px);
    border: 1px solid var(--card-border); box-shadow: var(--card-glow);
    border-radius: 14px; padding: 14px 8px;
  }
  .stat b{ display: block; font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .stat span{ font-size: 11.5px; color: var(--hint); font-weight: 700; }

  .review{ display: flex; flex-direction: column; gap: 8px; text-align: right; margin-bottom: 20px; }
  .rev{
    display: flex; align-items: center; gap: 10px; background: var(--card);
    backdrop-filter: blur(12px); border: 1px solid var(--card-border);
    border-radius: 12px; padding: 12px 14px; font-size: 13.5px; font-weight: 700;
  }
  .rev i{
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 900; font-style: normal;
  }
  .rev.y i{ background: rgba(34, 197, 94, 0.2); color: var(--ok); }
  .rev.n i{ background: rgba(239, 68, 68, 0.2); color: var(--bad); }
  .rev span{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0.95; }

  
  /* Grade Breakdown in Result */
  .grade-breakdown{
    display: flex; gap: 8px; margin-bottom: 18px; justify-content: center; flex-wrap: wrap;
  }
  .gb-pill{
    background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px; padding: 6px 12px; font-size: 12px; font-weight: 700; color: var(--hint);
    display: flex; align-items: center; gap: 6px;
  }
  .gb-pill b{ color: var(--accent); font-variant-numeric: tabular-nums; font-size: 13px; }

  /* Unified App Footer */
  .app-footer{
    margin-top: 24px;
    background: var(--card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border); box-shadow: var(--card-glow);
    border-radius: 18px; padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap;
  }
  .foot-brand{ display: flex; align-items: center; gap: 10px; min-width: 0; }
  .foot-logo{
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #0284C7);
    color: #FFF; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.35); flex: 0 0 auto;
  }
  .foot-info{ display: flex; flex-direction: column; min-width: 0; }
  .foot-info b{ font-size: 12.5px; font-weight: 800; color: var(--text); }
  .foot-info span{ font-size: 10.5px; color: var(--hint); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot-links{ display: flex; align-items: center; gap: 8px; }
  .foot-link{
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(56, 189, 248, 0.10); border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 999px; padding: 5px 12px; text-decoration: none;
    font-size: 11px; font-weight: 800; color: var(--accent);
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .foot-link:hover{ background: rgba(56, 189, 248, 0.2); transform: translateY(-1px); }

  .foot{ margin-top: 24px; text-align: center; font-size: 11.5px; color: var(--hint); font-weight: 600; }
  .foot a{ color: var(--accent); text-decoration: none; font-weight: 800; }
</style>

<script>

/* ----- Lightweight Confetti Effect ----- */
function fireConfetti(x = window.innerWidth / 2, y = window.innerHeight / 3) {
  const canvas = document.createElement('canvas');
  canvas.style.position = 'fixed';
  canvas.style.inset = '0';
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.pointerEvents = 'none';
  canvas.style.zIndex = '9999';
  document.body.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ['#38BDF8', '#F1C40F', '#22C55E', '#EC4899', '#A855F7', '#F97316'];
  const particles = Array.from({ length: 45 }, () => ({
    x: x,
    y: y,
    vx: (Math.random() - 0.5) * 12,
    vy: (Math.random() - 0.8) * 14 - 2,
    size: Math.random() * 6 + 4,
    color: colors[Math.floor(Math.random() * colors.length)],
    rot: Math.random() * 360,
    vrot: (Math.random() - 0.5) * 15,
    alpha: 1
  }));

  let start = null;
  function step(ts) {
    if (!start) start = ts;
    const progress = ts - start;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.45;
      p.rot += p.vrot;
      p.alpha = Math.max(0, 1 - progress / 1200);

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rot * Math.PI) / 180);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.alpha;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
    });

    if (progress < 1200) {
      requestAnimationFrame(step);
    } else {
      canvas.remove();
    }
  }
  requestAnimationFrame(step);
}

const TIME_PER_Q = 60;   // ثانیه
const FA = ["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];

/* ---------- Telegram SDK (اختیاری — لوکال هم کار می‌کند) ---------- */
const TG = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

  TG.ready();

  if (TG.isVersionAtLeast && TG.isVersionAtLeast('6.1')) { try { TG.setHeaderColor('#080D1F'); } catch(e){} try { TG.setBackgroundColor('#080D1F'); } catch(e){} } if (TG.isVersionAtLeast && TG.isVersionAtLeast('7.10')) { try { TG.setBottomBarColor('#080D1F'); } catch(e){} }
}
const haptic = t => { if (TG && TG.HapticFeedback) { try { TG.HapticFeedback.impactOccurred(t); } catch(e){} } };

/* ---------- state ---------- */
let curGrade = "all";
let QUESTIONS = ALL_QUESTIONS;
let i = 0, score = 0, left = TIME_PER_Q, tick = null, answers = [];

function setGrade(g){
  curGrade = g;
  document.querySelectorAll(".gb").forEach(b => b.classList.toggle("on", b.dataset.g === g));
  QUESTIONS = (g === "all") ? ALL_QUESTIONS : ALL_QUESTIONS.filter(q => q.g === g);
  i = 0; score = 0; answers = [];
  renderQuestion();
}
document.querySelectorAll(".gb").forEach(b => b.addEventListener("click", () => setGrade(b.dataset.g)));

const el = id => document.getElementById(id);
const app = el("app");

function stopTimer(){ if (tick) { clearInterval(tick); tick = null; } }

function setTimer(v){
  el("tv").textContent = fa(v);
  el("timer").classList.toggle("warn", v <= 10);
}

function renderQuestion(){
  const q = QUESTIONS[i];
  left = TIME_PER_Q;
  setTimer(left);
  el("bar").style.width = ((i / QUESTIONS.length) * 100) + "%";

  app.innerHTML = `
    <div class="qcard">
      <div class="qno">سؤال ${fa(i+1)} از ${fa(QUESTIONS.length)}</div>
    <div class="qtext">${q.q}</div>
    ${q.eq ? `<div class="eq">${q.eq}</div>` : ""}
    <div class="opts" id="opts">
      ${q.opts.map((o,k)=>`
        <button class="opt" data-k="${k}">
          <span class="k">${fa(k+1)}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div id="fb"></div>
    <button class="cta" id="next" hidden>سؤال بعدی</button>
  `;

  app.querySelectorAll(".opt").forEach(b =>
    b.addEventListener("click", () => pick(+b.dataset.k)));

  stopTimer();
  tick = setInterval(() => {
    left--;
    setTimer(left);
    if (left <= 0) { stopTimer(); pick(-1); }
  }, 1000);
}

function pick(k){
  stopTimer();
  const q = QUESTIONS[i];
  const ok = k === q.ans;
  if (ok) { score++; fireConfetti(); }
  answers.push({ i, k, ok });
  haptic(ok ? "light" : "rigid");

  app.querySelectorAll(".opt").forEach(b => {
    const bk = +b.dataset.k;
    b.disabled = true;
    if (bk === q.ans) b.classList.add("correct");
    else if (bk === k) b.classList.add("wrong");
  });

  el("fb").innerHTML = `
    <div class="fb ${ok ? "ok" : "no"}">
      <h3>${ok ? "✅ درست" : (k === -1 ? "⏰ زمان تمام شد" : "❌ نادرست")}</h3>
      <p>${q.why}</p>
      <div class="steps">${q.steps.join("<br>")}</div>
    </div>`;

  const nxt = el("next");
  nxt.hidden = false;
  nxt.textContent = (i === QUESTIONS.length - 1) ? "دیدن نتیجه" : "سؤال بعدی";
  nxt.onclick = () => { i++; (i < QUESTIONS.length) ? renderQuestion() : renderResult(); };
  nxt.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function renderResult(){
  stopTimer();
  el("bar").style.width = "100%";
  el("tv").textContent = "—";

  const pct = Math.round((score / QUESTIONS.length) * 100);
  const C = 2 * Math.PI * 66;
  const off = C - (pct / 100) * C;
  const color = pct >= 80 ? "var(--ok)" : pct >= 50 ? "var(--gold)" : "var(--bad)";
  const msg = pct === 100 ? "بی‌نقص! 🏆"
            : pct >= 80 ? "عالی بود! 🔥"
            : pct >= 50 ? "خوب، ولی جای پیشرفت داری 💪"
            : "نیاز به مرور داری 📚";

  const right = answers.filter(a => a.ok).length;
  const wrong = answers.length - right;
  
  // Grade-wise percentages
  const g10 = answers.filter(a => QUESTIONS[a.i].grade === 10);
  const g11 = answers.filter(a => QUESTIONS[a.i].grade === 11);
  const g12 = answers.filter(a => QUESTIONS[a.i].grade === 12);
  const p10 = g10.length ? Math.round((g10.filter(a => a.ok).length / g10.length) * 100) : null;
  const p11 = g11.length ? Math.round((g11.filter(a => a.ok).length / g11.length) * 100) : null;
  const p12 = g12.length ? Math.round((g12.filter(a => a.ok).length / g12.length) * 100) : null;

  const used = answers.reduce((s,a) => s + (TIME_PER_Q - Math.max(left,0)), 0);

  app.innerHTML = `
    <div class="result">
      <div class="ring">
        <svg width="158" height="158">
          <circle cx="79" cy="79" r="66" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="11"/>
          <circle cx="79" cy="79" r="66" fill="none" stroke="${color}" stroke-width="11"
                  stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/>
        </svg>
        <div class="val"><b style="color:${color}">${fa(pct)}٪</b><span>درصد</span></div>
      </div>

      <h2>${msg}</h2>
      <div class="sub">${fa(right)} پاسخ درست از ${fa(QUESTIONS.length)} سؤال</div>

      <div class="stats">
        <div class="stat"><b style="color:var(--ok)">${fa(right)}</b><span>درست</span></div>
        <div class="stat"><b style="color:var(--bad)">${fa(wrong)}</b><span>نادرست</span></div>
        <div class="stat"><b>${fa(pct)}٪</b><span>درصد</span></div>
      </div>

      
      <div class="grade-breakdown">
        ${p10 !== null ? `<div class="gb-pill"><span>شیمی دهم:</span> <b>${fa(p10)}٪</b></div>` : ""}
        ${p11 !== null ? `<div class="gb-pill"><span>شیمی یازدهم:</span> <b>${fa(p11)}٪</b></div>` : ""}
        ${p12 !== null ? `<div class="gb-pill"><span>شیمی دوازدهم:</span> <b>${fa(p12)}٪</b></div>` : ""}
      </div>

      <div class="review">
        ${answers.map((a,n) => `
          <div class="rev ${a.ok ? "y" : "n"}">
            <i>${a.ok ? "✓" : "✕"}</i>
            <span>سؤال ${fa(n+1)} — ${QUESTIONS[a.i].q.slice(0,42)}…</span>
          </div>`).join("")}
      </div>

      <button class="cta" id="again">🔄 آزمون مجدد</button>
      <button class="cta ghost" id="share" style="margin-top:9px">📬 ثبت‌نام کلاس</button>
    </div>`;

  el("again").onclick = () => { i = 0; score = 0; answers = []; renderQuestion(); };
  el("share").onclick = () => {
    const url = "https://t.me/Elahe_md1383";
    if (TG) { try { TG.openTelegramLink(url); return; } catch(e){} }
    window.open(url, "_blank");
  };
  if (pct >= 60) { setTimeout(() => fireConfetti(window.innerWidth * 0.3, window.innerHeight * 0.3), 100); setTimeout(() => fireConfetti(window.innerWidth * 0.7, window.innerHeight * 0.3), 350); }
  haptic("medium");
}

/* ---------- start ---------- */
renderQuestion();
